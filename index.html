<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* Mode app sur iPad : la barre d’état passe par-dessus la page, on laisse la place. */
#app { padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.card-screen, .overlay, .felix, .glitch { padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
html, body { overscroll-behavior: none; }

<body>
<title>Antoinelott</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&display=swap">
<style>
/* Layout: one-screen party quiz played on a phone in front of the group. Black title cards between episodes (like the series), parchment-toned text on warm black, gold and blood red from the Kaamelott banner. Deliberately single dark look. */
:root {
  --bg: #120d0a;
  --panel: #1f1712;
  --line: #3a2c20;
  --parch: #efe3c8;
  --muted: #a8977c;
  --gold: #c9a14a;
  --red: #a3221c;
  --ok: #5f9f5c;
  --bad: #d0453a;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'Alegreya', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--parch); font-family: var(--body); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
#app {
  position: relative; height: 100%; max-width: 640px; margin: 0 auto; box-sizing: border-box;
  padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 12px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 38px; }
.bar .ep { font-family: var(--display); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--parch); font-variant-numeric: tabular-nums; white-space: nowrap; }
.score small { font-size: 10px; color: var(--muted); letter-spacing: .12em; margin-left: 4px; }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); transition: width .4s; }
main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.foot { display: flex; gap: 10px; flex-wrap: wrap; }
.foot:empty { display: none; }

.kicker { font-family: var(--display); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.q { font-size: 23px; line-height: 1.25; font-weight: 600; text-wrap: balance; margin: 0; }
.q.quote { font-style: italic; font-weight: 400; font-size: 24px; }
.q.quote::before { content: '« '; color: var(--gold); font-style: normal; }
.q.quote::after { content: ' »'; color: var(--gold); font-style: normal; }
.choices { display: grid; gap: 9px; }
.choice {
  text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 14px; font-size: 18px; line-height: 1.25; display: flex; gap: 12px; align-items: center;
  transition: border-color .2s, background .2s, opacity .2s;
}
.choice .k { font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 14px; min-width: 16px; }
.choice:active { transform: scale(.985); }
.choice.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 22%, var(--panel)); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 22%, var(--panel)); }
.choice.gone { opacity: .2; pointer-events: none; }
.choice[disabled] { cursor: default; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.two .choice { justify-content: center; text-align: center; font-family: var(--display); font-weight: 700; font-size: 17px; padding: 20px 10px; }
.chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 10px; font-size: 16px; line-height: 1.2; text-align: left; }
.chip.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 20%, var(--panel)); }
.chip.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 25%, var(--panel)); }
.chip.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 25%, var(--panel)); text-decoration: line-through; }
.chip.missed { border: 1px dashed var(--ok); color: var(--ok); }
.jokers { display: flex; gap: 8px; flex-wrap: wrap; }
.joker { background: none; border: 1px dashed var(--gold); color: var(--gold); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.joker[disabled] { opacity: .3; }
.verdict { border-left: 3px solid var(--gold); padding: 8px 12px; background: var(--panel); border-radius: 0 10px 10px 0; display: flex; flex-direction: column; gap: 4px; }
.verdict b { font-family: var(--display); font-size: 15px; letter-spacing: .06em; }
.verdict b.ok { color: var(--ok); } .verdict b.ko { color: var(--bad); }
.verdict span { font-size: 15px; line-height: 1.4; color: var(--parch); }
.friend { font-size: 15px; color: var(--gold); font-style: italic; }
.cta { flex: 1; background: var(--gold); color: #1a120b; border: 0; border-radius: 999px; padding: 14px 18px; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .06em; }
.cta.alt { background: none; color: var(--parch); border: 1px solid var(--line); flex: 0 1 auto; }
.cta[disabled] { opacity: .35; }
.play { align-self: center; width: 110px; height: 110px; border-radius: 50%; border: 2px solid var(--gold); background: var(--panel); font-size: 36px; color: var(--gold); }
.play.on { animation: pulse 1s infinite; }

/* Title cards */
.card-screen { position: absolute; inset: 0; z-index: 10; background: #000; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; overflow-y: auto; }
.card-in { max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 16px; text-align: center; margin: auto; animation: fade .8s ease-out; }
.livre { font-family: var(--display); font-size: 13px; letter-spacing: .35em; color: var(--muted); text-transform: uppercase; }
.big { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: .04em; color: var(--parch); margin: 0; text-wrap: balance; }
.big.gold { color: var(--gold); }
.mid { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; text-wrap: balance; }
.narr { font-size: 17px; line-height: 1.5; color: var(--parch); font-style: italic; text-align: left; }
.rules { text-align: left; display: grid; gap: 8px; font-size: 15px; line-height: 1.4; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; }
.rules div { display: grid; grid-template-columns: 110px 1fr; gap: 10px; }
.rules b { font-family: var(--display); font-size: 12px; letter-spacing: .08em; color: var(--gold); padding-top: 2px; }
.crest { width: 70px; height: 84px; margin: 0 auto; }

.portrait { width: 150px; aspect-ratio: 1; margin: 0 auto; padding: 7px; background: linear-gradient(135deg, #e3c26f, #8a6326 45%, #d9b25c 70%, #6e4d1c); box-shadow: 0 10px 30px rgba(0,0,0,.7), inset 0 0 0 2px #120d0a; border-radius: 3px; max-width: 100%; box-sizing: border-box; }
.portrait img { display: block; width: 100%; height: 100%; object-fit: cover; box-shadow: inset 0 0 12px #000; border: 2px solid #120d0a; }
.portrait.lg { width: 190px; }
.caption { font-family: var(--display); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-top: -6px; }

/* Wheel */
.wheel-wrap { position: relative; width: min(78vw, 330px); aspect-ratio: 1; margin: 0 auto; max-width: 100%; }
.wheel-wrap svg { width: 100%; height: 100%; transition: transform 4.2s cubic-bezier(.17,.67,.12,1); }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 24px solid var(--parch); z-index: 2; filter: drop-shadow(0 2px 3px #000); }
.gage { background: var(--parch); color: #1a120b; border-radius: 6px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 6px; transform: rotate(-1deg); animation: fade .4s; }
.gage .who { font-family: var(--display); font-weight: 900; font-size: 24px; color: var(--red); }
.gage p { margin: 0; font-size: 19px; line-height: 1.35; }

/* Félix */
.felix { position: absolute; inset: 0; z-index: 20; background: var(--red); display: flex; align-items: center; justify-content: center; padding: 20px 16px; text-align: center; animation: slam .25s ease-out; }
.felix .big { font-size: 38px; color: #fff; }
.felix p { font-size: 17px; color: #fff; margin: 12px 0 0; }
.glitch { position: absolute; inset: 0; z-index: 20; background: #000; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 16px; text-align: center; }
.glitch .big { color: #fff; font-size: 30px; animation: glitch .18s steps(2) infinite; }
.glitch p { font-family: ui-monospace, Consolas, monospace; font-size: 14px; line-height: 1.6; color: #7cff7c; margin: 0; text-align: left; max-width: 420px; }
.glitch #gend { width: 100%; max-width: 420px; }

.final-rank { font-family: var(--display); font-weight: 900; font-size: 30px; color: var(--gold); line-height: 1.05; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; display: flex; flex-direction: column; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stats b { font-family: var(--display); font-size: 24px; color: var(--parch); font-variant-numeric: tabular-nums; }
.from { font-size: 15px; line-height: 1.5; color: var(--muted); }

@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--gold) 0%, transparent), 0 0 0 0 var(--gold); transform: scale(1.04); } }
@keyframes slam { from { transform: scale(1.4); opacity: 0; } }
@keyframes glitch { 0% { transform: translate(2px,-1px); text-shadow: -3px 0 #f0f, 3px 0 #0ff; } 100% { transform: translate(-2px,1px); text-shadow: 3px 0 #f0f, -3px 0 #0ff; } }
@media (min-width: 700px) {
  #app { max-width: 980px; padding: 18px 32px 24px; gap: 18px; }
  main { justify-content: safe center; }
  .bar .ep { font-size: 14px; }
  .score { font-size: 28px; }
  .iconbtn { font-size: 15px; padding: 8px 14px; }
  .kicker { font-size: 13px; }
  .q, .q.quote { font-size: 34px; }
  .choices { grid-template-columns: 1fr 1fr; gap: 14px; }
  .choice { font-size: 22px; padding: 18px 20px; min-height: 78px; }
  .choice .k { font-size: 17px; }
  .two .choice { font-size: 24px; padding: 34px 14px; }
  .chips { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .chip { font-size: 20px; padding: 18px 14px; }
  .verdict { padding: 14px 18px; }
  .verdict b { font-size: 19px; }
  .verdict span, .friend { font-size: 20px; }
  .cta { font-size: 18px; padding: 18px 28px; }
  .joker { font-size: 16px; padding: 10px 18px; }
  .play { width: 170px; height: 170px; font-size: 56px; }
  .card-in { max-width: 700px; gap: 22px; }
  .livre { font-size: 15px; }
  .big { font-size: 76px; }
  .mid { font-size: 36px; }
  .narr { font-size: 21px; }
  .rules { font-size: 18px; gap: 12px; }
  .rules div { grid-template-columns: 170px 1fr; }
  .rules b { font-size: 14px; }
  .portrait { width: 220px; }
  .portrait.lg { width: 280px; }
  .caption { font-size: 13px; }
  .wheel-wrap { width: min(54vh, 480px); }
  .gage { padding: 22px 24px; }
  .gage .who { font-size: 34px; }
  .gage p { font-size: 25px; }
  .felix .big, .glitch .big { font-size: 56px; }
  .glitch p { font-size: 18px; }
  .final-rank { font-size: 46px; }
  .stats b { font-size: 36px; }
  .stats div { font-size: 13px; padding: 14px 6px; }
  .from { font-size: 20px; }
}
/* Tablette à l’horizontale : portrait à gauche, texte à droite, pour que tout tienne sans défiler. */
@media (min-width: 900px) and (orientation: landscape) {
  .card-in.split { max-width: 1040px; display: grid; grid-template-columns: 300px 1fr; column-gap: 48px; row-gap: 14px; text-align: left; align-items: start; }
  .card-in.split > * { grid-column: 2; }
  .card-in.split > .portrait { grid-column: 1; grid-row: 1 / span 6; width: 100%; align-self: center; }
  .card-in.split > .caption { grid-column: 1; grid-row: 7; text-align: center; margin-top: 0; }
  .card-in.split .big { font-size: 64px; }
  .card-in.split .narr { font-size: 19px; text-align: left !important; }
  .card-in.split .rules { font-size: 16px; }
  .card-in.split .crest { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card-in, .gage, .felix { animation: none; } .glitch .big { animation: none; } .wheel-wrap svg { transition-duration: 1s; } }
@media (max-height: 640px) { .q { font-size: 20px; } .choice { padding: 10px 12px; font-size: 16px; } .big { font-size: 36px; } }
</style>

<div id="app">
  <div class="bar">
    <span class="ep" id="epLabel">Livre XXXVI</span>
    <span class="score" id="score">0<small>PTS</small></span>
    <span style="display:flex;gap:8px"><button class="iconbtn" id="fs" hidden>Plein écran</button><button class="iconbtn" id="skip">Passer l’épisode</button></span>
  </div>
  <div class="progress"><i id="prog" style="width:0%"></i></div>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const FRIENDS = ['Isabelle', 'Félix', 'Lucy', 'Matthieu', 'Thomas', 'Borloz', 'Yvain'];
const PLAYERS = ['Antoine', ...FRIENDS];

/* ---------------- Contenu ---------------- */
const EPISODES = [
  {
    title: 'Le Quiz du Bon Vivant', type: 'mcq',
    intro: 'Vins, tables, rugby, badminton, cinéma et blues. Le seigneur Antoine prétend tout savoir. On va voir.',
    items: [
      { q: 'Quel cépage rouge fait la quasi-totalité des vins du Beaujolais ?', c: ['Gamay', 'Pinot noir', 'Syrah', 'Mondeuse'], note: 'Le gamay noir à jus blanc, des crus jusqu’au nouveau.' },
      { q: 'Une bouteille de 15 litres, c’est un…', c: ['Nabuchodonosor', 'Balthazar', 'Salmanazar', 'Mathusalem'], note: 'Mathusalem 6 L, Salmanazar 9 L, Balthazar 12 L, Nabuchodonosor 15 L.' },
      { q: 'À combien de degrés titre la Chartreuse verte ?', c: ['55 %', '40 %', '43 %', '69 %'], note: '55 %. La jaune est nettement plus douce.' },
      { q: 'Qui a écrit « Physiologie du goût » (1825) ?', c: ['Brillat-Savarin', 'Grimod de La Reynière', 'Auguste Escoffier', 'Marie-Antoine Carême'], note: 'Jean Anthelme Brillat-Savarin, magistrat et gastronome.' },
      { q: 'Combien de sauces mères dans la cuisine classique selon Escoffier ?', c: ['5', '3', '4', '7'], note: 'Béchamel, velouté, espagnole, tomate et hollandaise.' },
      { q: 'En Méditerranée, le « loup », c’est…', c: ['Le bar', 'Le brochet', 'Le congre', 'Le merlu'], note: 'Bar sur l’Atlantique, loup en Méditerranée. Même poisson.' },
      { q: 'QUESTION DE FÉLIX. Quel est le pire genre musical de l’histoire de l’humanité ?', c: ['Le jazz', 'Le blues', 'La country', 'L’accordéon'], note: 'Question rédigée par Félix. Aucune contestation ne sera acceptée.', felix: true },
      { q: 'Record officiel du smash le plus rapide au badminton ?', c: ['565 km/h', '332 km/h', '426 km/h', '493 km/h'], note: 'Satwiksairaj Rankireddy, 565 km/h en 2023. Plus rapide qu’une F1.' },
      { q: 'Quel club est le plus titré du championnat de France de rugby ?', c: ['Stade toulousain', 'Stade français', 'AS Béziers', 'SU Agen'], note: 'Le Stade toulousain, loin devant tout le monde.' },
      { q: 'Qui a réalisé « La Grande Bouffe » (1973) ?', c: ['Marco Ferreri', 'Ettore Scola', 'Luis Buñuel', 'Claude Sautet'], note: 'Marco Ferreri, avec Noiret, Piccoli, Mastroianni et Tognazzi.' },
      { q: 'Selon la légende, où Robert Johnson a-t-il vendu son âme au diable ?', c: ['À un carrefour', 'Dans un bayou', 'Dans un bar de Memphis', 'Sur un bateau à aubes'], note: 'Au crossroads, en échange de son jeu de guitare.' }
    ]
  },
  {
    title: 'Qu’y a-t-il dedans ?', type: 'multi',
    intro: 'Un grand chef sait ce qu’il y a dans l’assiette. Sélectionner tous les bons ingrédients, et seulement eux. Une seule erreur coûte cher.',
    items: [
      { q: 'Un Negroni', ok: ['Gin', 'Vermouth rouge', 'Campari'], ko: ['Aperol', 'Prosecco', 'Vodka', 'Vermouth blanc', 'Cointreau'], note: 'Un tiers gin, un tiers vermouth rouge, un tiers Campari. Avec du prosecco, c’est un Sbagliato.' },
      { q: 'Une quiche lorraine', ok: ['Pâte brisée', 'Lardons', 'Œufs', 'Crème'], ko: ['Gruyère', 'Oignons', 'Jambon', 'Poireaux', 'Muscade'], note: 'La vraie lorraine n’a ni fromage ni oignons. Avec des oignons, on part en Alsace.' },
      { q: 'Une tartiflette', ok: ['Reblochon', 'Pommes de terre', 'Lardons', 'Oignons'], ko: ['Raclette', 'Comté', 'Jambon blanc', 'Champignons'], note: 'Le reblochon est obligatoire. Le reste, c’est de la contrefaçon.' },
      { q: 'Une blanquette de veau', ok: ['Veau', 'Carottes', 'Champignons', 'Crème', 'Jaune d’œuf', 'Clou de girofle'], ko: ['Vin rouge', 'Tomate', 'Lardons', 'Moutarde', 'Poivron'], note: 'Oignon piqué de clous de girofle dans le bouillon, liaison crème et jaune d’œuf à la fin. Et surtout, rien ne doit colorer.' },
      { q: 'Un bœuf bourguignon', ok: ['Bœuf', 'Vin rouge', 'Lardons', 'Champignons', 'Petits oignons', 'Carottes'], ko: ['Vin blanc', 'Crème fraîche', 'Pommes de terre', 'Poivrons'], note: 'Du vin rouge de Bourgogne, idéalement. Les pommes de terre, c’est à côté.' },
      { q: 'Une sauce béarnaise', ok: ['Beurre', 'Jaunes d’œufs', 'Échalote', 'Estragon', 'Vinaigre'], ko: ['Citron', 'Moutarde', 'Crème', 'Ciboulette', 'Vin rouge'], note: 'Réduction d’échalote, d’estragon et de vinaigre, montée au beurre avec les jaunes. Le citron, c’est la hollandaise ; le vin rouge, la bordelaise.' },
      { q: 'Une sauce gribiche', ok: ['Œufs durs', 'Moutarde', 'Huile', 'Vinaigre', 'Cornichons', 'Câpres'], ko: ['Jaunes d’œufs crus', 'Crème', 'Ail', 'Anchois', 'Ketchup'], note: 'Une mayonnaise montée avec des jaunes d’œufs durs, puis cornichons, câpres et fines herbes. Les jaunes crus, c’est la vraie mayo.' },
    ]
  },
  {
    title: 'Critique ou Charabia', type: 'mcq',
    intro: 'La carte d’un chef triplement étoilé qui refuse d’appeler quoi que ce soit par son nom. Décoder chaque intitulé pour retrouver le plat tout simple qui se cache derrière.',
    items: [
      { q: 'Tubercule en sections longitudinales, deux bains de graisse successifs, cristaux de marais salant, nuage de jaune émulsionné au sénevé de Dijon.', c: ['Des frites-mayo', 'Des pommes dauphines', 'Des pommes Anna', 'Des chips au vinaigre'], note: 'Deux bains de friture et une mayonnaise à la moutarde (le sénevé, c’est la graine de moutarde).', quote: true },
      { q: 'Mie industrielle en sandwich thermique, cuisse arrière de porc cuite, lait épaissi au roux, le tout coiffé d’une poule en devenir saisie à plat.', c: ['Un croque-madame', 'Un croque-monsieur', 'Un welsh', 'Un pain perdu'], note: 'Pain de mie, jambon, béchamel et un œuf au plat sur le dessus : croque-madame.', quote: true },
      { q: 'Tubes de semoule de blé dur, bajoue de cochon séchée au sel, jaune de poule cuit à la seule chaleur résiduelle, brebis romaine râpée, poussière de poivre.', c: ['Des pâtes carbonara', 'Des pâtes amatriciana', 'Des cacio e pepe', 'Des pâtes Alfredo'], note: 'Guanciale, jaunes d’œufs, pecorino romano et poivre : la carbonara.', quote: true },

const YVAIN_GAGE = 'Yvain annonce « Je suis Yvain, le Chevalier au Lion » avant chacune de ses phrases, jusqu’à la fin du jeu. Chaque oubli : une gorgée.';

/* ---------------- État ---------------- */
let G;
function reset() { G = { ep: 0, i: 0, score: 0, essais: 0, max: 0, epPts: 0, epMax: 0, jokers: { fifty: 1, ami: 1 }, t0: 0, answered: false, wheelRot: 0, usedGages: new Set() }; }
// Tire un gage jamais sorti pendant cette partie (le paquet ne se remélange que s’il est épuisé).
function drawGage(p, others) {
  if (p === 'Yvain' && !G.usedGages.has(YVAIN_GAGE)) { G.usedGages.add(YVAIN_GAGE); return YVAIN_GAGE; }
  let pool = GAGES.filter(g => !G.usedGages.has(g));
  if (!pool.length) { GAGES.forEach(g => G.usedGages.delete(g)); pool = GAGES.slice(); }
  const g = pick(pool); G.usedGages.add(g);
  return g.replace(/\{p\}/g, p).replace(/\{o\}/g, pick(others));
}
reset();
const main = $('#main'), foot = $('#foot');
const setFoot = html => { foot.innerHTML = html; };

function hud() {
  $('#score').innerHTML = `${G.score}<small>PTS</small>`;
  const ep = EPISODES[G.ep];
  $('#epLabel').textContent = ep ? `Épisode ${G.ep + 1} · ${ep.title}` : 'Livre XXXVI';
  const total = EPISODES.reduce((s, e) => s + e.items.length, 0);
  const done = EPISODES.slice(0, G.ep).reduce((s, e) => s + e.items.length, 0) + G.i;
  $('#prog').style.width = (100 * done / total) + '%';
}

function titleScreen() {
  const o = overlay('card-screen', `<div class="card-in split">
    ${PORTRAIT(false, 'Le seigneur Antoine')}
    <div class="livre">Livre XXXVI</div>
    <h1 class="big gold">Antoinelott</h1>
    <p class="narr">En ces temps troublés, le seigneur Antoine, fin gastronome et futur tenancier d’une auberge de renom, doit prouver sa valeur devant sa cour : Isabelle, Félix, Lucy, Matthieu, Thomas, Borloz et Yvain. Sept épreuves, des gages, et pas une seule note de jazz, par décret du seigneur Félix.</p>
    <div class="rules">
      <div><b>Cash ou carré</b><span>Aux questions à choix : répondre à voix haute sans voir les propositions rapporte 10 points. Demander le carré (4 propositions) n’en rapporte que 5.</span></div>
      <div><b>Essai</b><span>Les autres bonnes réponses : 5 points.</span></div>
      <div><b>Transformation</b><span>Bonne réponse en moins de 10 secondes : 2 points de plus.</span></div>
      <div><b>Jokers</b><span>Un 50/50 et un appel à un ami pour toute la partie, utilisables dans le carré.</span></div>
      <div><b>Gages</b><span>À la fin de chaque épisode, la Roue du Destin désigne une victime.</span></div>
    </div>
    <button class="cta" id="begin">Commencer la quête</button>
  </div>`);
  o.querySelector('#begin').onclick = () => { initAudio(); sfx('horn'); o.remove(); episodeCard(); };
}
function episodeCard() {
  hud();
  const ep = EPISODES[G.ep];
  G.epPts = 0; G.epMax = 0; G.i = 0;
  if (ep.shuffle) ep.items = shuffle(ep.items);
  const o = overlay('card-screen', `<div class="card-in">
    <div class="livre">Livre XXXVI · Épisode ${G.ep + 1}</div>
    <h2 class="big">${esc(ep.title)}</h2>
    <p class="narr">${esc(ep.intro)}</p>
    <button class="cta" id="go">C’est parti</button>
  </div>`);
  o.querySelector('#go').onclick = () => { o.remove(); showItem(); };
}

/* ---------------- Items ---------------- */
function showItem() {
  hud();
  const ep = EPISODES[G.ep], it = ep.items[G.i];
  G.answered = false; G.t0 = performance.now();
  if (ep.type === 'mcq') renderMcq(ep, it);
  else if (ep.type === 'multi') renderMulti(it);
  else if (ep.type === 'bin') renderBin(ep, it);
  else if (ep.type === 'blind') renderBlind(it);
  main.scrollTop = 0;
}
function counter(ep) { return `<div class="kicker">${ep.hard ? 'Niveau chevalier · ' : ''}Question ${G.i + 1} / ${ep.items.length}</div>`; }

function score(ok, fastLimit = 10, partial = 0, base = 5, maxPts = base + 2, elapsed = (performance.now() - G.t0) / 1000) {
  const fast = elapsed < fastLimit;
  let pts = 0;
  if (ok) { pts = base + (fast ? 2 : 0); G.essais++; }
  else pts = partial;
  G.score += pts; G.epPts += pts; G.max += maxPts; G.epMax += maxPts;
  hud();
  return { pts, fast: ok && fast };
}
function verdict(ok, res, note, label) {
  const head = ok ? (res.fast ? `Essai transformé ! +${res.pts}` : `Essai ! +${res.pts}`) : (res.pts ? `Presque. +${res.pts}` : 'Raté.');
  return `<div class="verdict"><b class="${ok ? 'ok' : 'ko'}">${label || head}</b>${note ? `<span>${esc(note)}</span>` : ''}</div>`;
}
function nextBtn() {
  setFoot(`<button class="cta" id="next">Suite</button>`);
  $('#next').onclick = next;
}
function next() {
  stopMusic();
  const ep = EPISODES[G.ep];
  G.i++;
  if (G.i < ep.items.length) showItem(); else episodeEnd();
}

function renderMcq(ep, it) {
  main.innerHTML = `${counter(ep)}<p class="q${it.quote ? ' quote' : ''}">${esc(it.q)}</p>
    <div class="choices" id="mc"></div><div id="after"></div>`;
  askMode(it, $('#mc'));
}

// Cash : réponse à voix haute sans propositions (10 pts, la table juge). Carré : 4 propositions (5 pts).
function askMode(it, box) {
  setFoot(`<button class="cta alt" id="cash">Cash · 10 pts</button><button class="cta" id="carre">Le carré · 5 pts</button>`);
  $('#cash').onclick = () => cash(it);
  $('#carre').onclick = () => carre(it, box);
}
function cash(it) {
  $('#after').innerHTML = `<p class="friend">Réponse à voix haute, sans propositions. La table est juge.</p>`;
  setFoot(`<button class="cta" id="reveal">Révéler la réponse</button>`);
  $('#reveal').onclick = () => {
    // La transformation se mesure jusqu’au moment où on révèle la réponse, pas pendant le débat de la table.
    const elapsed = (performance.now() - G.t0) / 1000;
    $('#after').innerHTML = `<div class="verdict"><b>Réponse : ${esc(it.c[0])}</b><span>Alors, il avait bon ?</span></div>`;
    setFoot(`<button class="cta alt" id="ko">Raté</button><button class="cta" id="ok">Il avait bon</button>`);
    const judge = ok => {
      if (G.answered) return; G.answered = true;
      const res = score(ok, 12, 0, 10, 12, elapsed);
      sfx(ok ? 'ok' : 'ko');
      const label = it.felix ? (ok ? `Félix approuve. +${res.pts}` : 'Réponse refusée par Félix.')
        : ok ? `Cash ! ${res.fast ? 'Et transformé ! ' : ''}+${res.pts}` : 'Raté.';
      $('#after').innerHTML = verdict(ok, res, `Réponse : ${it.c[0]}. ${it.note || ''}`, label);
      nextBtn();
    };
    $('#ok').onclick = () => judge(true);
    $('#ko').onclick = () => judge(false);
  };
}
function carre(it, box) {
  const order = shuffle(it.c.map((t, k) => ({ t, k })));
  box.innerHTML = order.map((o, n) => `<button class="choice" data-k="${o.k}"><span class="k">${'ABCD'[n]}</span><span>${esc(o.t)}</span></button>`).join('');
  $('#after').innerHTML = '';
  setFoot(`<div class="jokers"><button class="joker" id="j50" ${G.jokers.fifty ? '' : 'disabled'}>50/50</button><button class="joker" id="jami" ${G.jokers.ami ? '' : 'disabled'}>Appel à un ami</button></div>`);
  $('#j50').onclick = () => {
    if (!G.jokers.fifty || G.answered) return; G.jokers.fifty = 0;
    shuffle([...box.querySelectorAll('.choice')].filter(b => b.dataset.k !== '0')).slice(0, 2).forEach(b => b.classList.add('gone'));
    $('#j50').disabled = true;
  };
  $('#jami').onclick = () => {
    if (!G.jokers.ami || G.answered) return; G.jokers.ami = 0;
    $('#after').innerHTML = `<p class="friend">${pick(FRIENDS)} a 20 secondes pour t’aider. Le reste de la table se tait.</p>`;
    $('#jami').disabled = true;
  };
  box.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if (G.answered) return; G.answered = true;
    const ok = b.dataset.k === '0';
    box.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (x.dataset.k === '0') x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    const res = score(ok, 10, 0, 5, 12);
    sfx(ok ? 'ok' : 'ko');
    let label;
    if (it.felix) label = ok ? `Félix approuve. +${res.pts}` : 'Réponse refusée par Félix.';
    $('#after').innerHTML = verdict(ok, res, it.note, label);
    nextBtn();
  });
}

function renderMulti(it) {
  const ep = EPISODES[G.ep];
  const all = shuffle([...it.ok.map(t => ({ t, ok: true })), ...it.ko.map(t => ({ t, ok: false }))]);
  main.innerHTML = `${counter(ep)}<p class="q">Qu’y a-t-il dans ${esc(it.q.replace(/^Une? /, m => m === 'Un ' ? 'un ' : 'une '))} ?</p>
    <div class="kicker">Tout sélectionner, sans rien oublier</div>
    <div class="chips">${all.map((x, n) => `<button class="chip" data-n="${n}">${esc(x.t)}</button>`).join('')}</div><div id="after"></div>`;
  const chips = [...main.querySelectorAll('.chip')];
  chips.forEach(c => c.onclick = () => { if (!G.answered) { c.classList.toggle('on'); sfx('tick'); } });
  setFoot(`<button class="cta" id="val">Valider</button>`);
  $('#val').onclick = () => {
    if (G.answered) return; G.answered = true;
    let errors = 0;
    chips.forEach((c, n) => {
      const on = c.classList.contains('on'), ok = all[n].ok;
      c.classList.remove('on'); c.disabled = true;
      if (on && ok) c.classList.add('right');
      else if (on && !ok) { c.classList.add('wrong'); errors++; }
      else if (!on && ok) { c.classList.add('missed'); errors++; }
    });
    const perfect = errors === 0;
    const res = score(perfect, 20, errors === 1 ? 2 : 0);
    sfx(perfect ? 'ok' : 'ko');
    $('#after').innerHTML = verdict(perfect, res, (errors ? `${errors} erreur${errors > 1 ? 's' : ''}. ` : '') + it.note);
    nextBtn();
  };
}

function renderBin(ep, it) {
  main.innerHTML = `${counter(ep)}<p class="q${it.quote ? ' quote' : ''}">${esc(it.q)}</p>
    <div class="two">${ep.labels.map((l, k) => `<button class="choice" data-k="${k}">${esc(l)}</button>`).join('')}</div><div id="after"></div>`;
  setFoot('');
  main.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if (G.answered) return; G.answered = true;
    const ok = +b.dataset.k === it.a;
    main.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (+x.dataset.k === it.a) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    const res = score(ok, 6);
    sfx(ok ? 'ok' : 'ko');
    $('#after').innerHTML = verdict(ok, res, it.note);
    nextBtn();
  });
}

function renderBlind(it) {
  const ep = EPISODES[G.ep];
  main.innerHTML = `${counter(ep)}<p class="q">Quelle est cette œuvre ?</p>
    <button class="play" id="play" aria-label="Écouter">▶</button>
    <div class="choices" id="bch"></div><div id="after"></div>`;
  setFoot('');
  const play = $('#play');
  let started = false;
  play.onclick = () => {
    initAudio();
    play.classList.add('on');
    const dur = playMelody(it.mel, it.bpm, false, it.voice);
    setTimeout(() => play.classList.remove('on'), dur * 1000);
    // Le chrono démarre à la première écoute ; on peut réécouter autant qu’on veut.
    if (!started) { started = true; G.t0 = performance.now(); if (!G.answered) askMode(it, $('#bch')); }
  };
}

/* ---------------- Fin d’épisode + roue ---------------- */
function episodeEnd() {
  hud();
  const pct = G.epMax ? G.epPts / G.epMax : 0;
  const mood = pct >= .75 ? 'Du grand art. La cour applaudit.' : pct >= .45 ? 'Honorable. On a vu pire, on a vu Perceval.' : 'Catastrophique. Le seigneur Bohort a failli vomir.';
  main.innerHTML = `<div class="kicker">Fin de l’épisode ${G.ep + 1}</div>
    <p class="q">${esc(EPISODES[G.ep].title)} : ${G.epPts} points sur ${G.epMax}.</p>
    <p class="narr">${mood} Place maintenant à la Roue du Destin.</p>`;
  setFoot(`<button class="cta" id="wheel">Faire tourner la roue</button>`);
  $('#wheel').onclick = () => wheel(pct);
  if (G.ep === 2) setTimeout(glitch, 400);
}
function glitch() {
  sfx('glitch');
  const o = overlay('glitch', `<div class="big">ERREUR SYSTÈME</div><p id="glog"></p><div id="gend"></div>`);
  const lines = [
    '&gt; erreur critique dans le module « Graal »',
    '&gt; origine du problème : un certain Félix a touché aux câbles',
    '&gt; tentative de réparation avec du scotch… 87 %',
    '&gt; tentative de réparation par Merlin… échec',
    '&gt; tentative de réparation par Perceval… « c’est pas faux »',
    '&gt; redémarrage du Graal…'
  ];
  lines.forEach((l, i) => setTimeout(() => { o.querySelector('#glog').innerHTML += (i ? '<br>' : '') + l; sfx('glitch'); }, 700 + i * 900));
  setTimeout(() => {
    o.querySelector('.big').style.animation = 'none';
    o.querySelector('.big').textContent = 'Pas de panique, Antoine';
    o.querySelector('#gend').innerHTML = `<div class="gage" style="margin-top:8px"><div class="who">C’était une blague de Félix</div><p>Rien n’est cassé. Le jeu t’attend, tes points aussi.</p></div>
      <button class="cta" id="gok" style="margin-top:14px;width:100%">Reprendre la partie</button>`;
    o.querySelector('#gok').onclick = () => o.remove();
  }, 700 + lines.length * 900 + 600);
}
function wheel(pct) {
  const N = PLAYERS.length, cx = 100, cy = 100, r = 96;
  const cols = ['#a3221c', '#c9a14a', '#2a1f18', '#7a1a15', '#b08a3a', '#1f1712', '#8f2a1f', '#d6b465'];
  let segs = '';
  PLAYERS.forEach((p, i) => {
    const a0 = (i * 360 / N - 90) * Math.PI / 180, a1 = ((i + 1) * 360 / N - 90) * Math.PI / 180;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const mid = (i + .5) * 360 / N;
    const light = i % 3 === 1 || i === 7;
    segs += `<path d="M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${cols[i]}" stroke="#120d0a" stroke-width="1.5"/>
      <text x="${cx}" y="${cy - 58}" transform="rotate(${mid} ${cx} ${cy})" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="11" fill="${light ? '#1a120b' : '#efe3c8'}">${esc(p)}</text>`;
  });
  main.innerHTML = `<div class="kicker">La Roue du Destin</div>
    <div class="wheel-wrap"><div class="pointer"></div><svg viewBox="0 0 200 200" id="wsvg" style="transform:rotate(${G.wheelRot}deg)">${segs}<circle cx="100" cy="100" r="14" fill="#120d0a" stroke="#c9a14a" stroke-width="2"/></svg></div>
    <div id="gage"></div>`;
  setFoot(`<button class="cta" id="spin">Tourner</button>`);
  $('#spin').onclick = () => {
    $('#spin').disabled = true;
    // Plus Antoine a raté l’épisode, plus la roue a tendance à le choisir.
    // Premier tour de roue truqué : il tombe toujours sur Yvain.
    const idx = !G.yvainDone ? PLAYERS.indexOf('Yvain') : Math.random() < (pct < .5 ? .45 : .15) ? 0 : 1 + (Math.random() * (N - 1) | 0);
    G.yvainDone = true;
    const center = (idx + .5) * 360 / N;
    const base = Math.ceil(G.wheelRot / 360) * 360;
    G.wheelRot = base + 360 * 5 + (360 - center) + (Math.random() * 20 - 10);
    $('#wsvg').style.transform = `rotate(${G.wheelRot}deg)`;
    let ticks = 0; const tk = setInterval(() => { sfx('tick'); if (++ticks > 22) clearInterval(tk); }, 170);
    setTimeout(() => {
      const p = PLAYERS[idx];
      const others = PLAYERS.filter(x => x !== p);
      const txt = drawGage(p, others);
      sfx('horn');
      $('#gage').innerHTML = `<div class="gage"><div class="who">${esc(p)}</div><p>${esc(txt)}</p></div>`;
      const last = G.ep === EPISODES.length - 1;
      setFoot(`<button class="cta alt" id="again">Autre gage</button><button class="cta" id="cont">${last ? 'Le verdict final' : 'Épisode suivant'}</button>`);
      $('#again').onclick = () => { $('#gage').innerHTML = `<div class="gage"><div class="who">${esc(p)}</div><p>${esc(drawGage(p, others))}</p></div>`; $('#again').disabled = true; };
      $('#cont').onclick = () => { G.ep++; if (G.ep < EPISODES.length) episodeCard(); else finale(); };
    }, 4300);
  };
}
$('#skip').onclick = () => {
  if (G.ep >= EPISODES.length || document.querySelector('.card-screen, .felix, .glitch')) return;
  stopMusic(); G.i = EPISODES[G.ep].items.length; episodeEnd();
};

/* ---------------- Finale ---------------- */
function finale() {
  hud(); $('#prog').style.width = '100%';
  const pct = G.max ? G.score / G.max : 0;
  const rank = pct < .35 ? ['Chevalier de bas étage', 'Perceval lui-même aurait fait mieux. Enfin, peut-être pas.']
    : pct < .6 ? ['Chevalier de la Table Ronde', 'Une place autour de la table, entre Karadoc et le plateau de fromages.']
    : pct < .8 ? ['Seigneur de Kaamelott', 'Léodagan grogne, mais il est impressionné.']
    : ['Roi de Bretagne', 'Excalibur s’est illuminée toute seule. Et le Graal était dans la cave à vins.'];
  const o = overlay('card-screen', `<div class="card-in split">
    ${PORTRAIT(true, 'Antoine, ' + rank[0])}
    <div class="livre">Fin du Livre XXXVI</div>
    <div class="final-rank">${esc(rank[0])}</div>
    <p class="narr" style="text-align:center">${esc(rank[1])}</p>
    <div class="stats"><div><b>${G.score}</b>points</div><div><b>${G.essais}</b>essais</div><div><b>${Math.round(pct * 100)}%</b>du max</div></div>
    <h2 class="big gold" style="font-size:34px">Joyeux anniversaire, Antoine</h2>
    <p class="from">Joyeux anniversaire, mon Antoine. Merci pour les badmintons endiablés et tous les repas où tu m’as fait manger mieux que je ne le méritais. Que ton hôtel-restaurant te ressemble : élégant, généreux et toujours plein. Je suis fier de toi, mon pote. Je t’aime.<br><br>Félix</p>
    <div class="foot"><button class="cta alt" id="song">Rejouer la chanson</button><button class="cta" id="restart">Recommencer</button></div>
  </div>`);
  setTimeout(birthday, 900);
  o.querySelector('#song').onclick = birthday;
  o.querySelector('#restart').onclick = () => { o.remove(); stopMusic(); reset(); main.innerHTML = ''; setFoot(''); hud(); titleScreen(); };
}
function birthday() { initAudio(); playMelody([[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],[67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,3]], 110); }

/* ---------------- Audio ---------------- */
let AC, master, music, noiseBuf, live = [];
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  music = AC.createGain(); music.connect(master);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function env(g, t, peak, dec, att = .006) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + att + dec); }
function tone(t, f, type, peak, dec, dest, lp) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  let n = o; if (lp) { const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); n = fl; }
  n.connect(g); g.connect(dest || master); env(g, t, peak, dec); o.start(t); o.stop(t + dec + .05); return o;
}
function noise(t, type, freq, peak, dec, dest) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; s.connect(f); f.connect(g); g.connect(dest || master);
  env(g, t, peak, dec, .002); s.start(t, Math.random() * .5); s.stop(t + dec + .05); return s;
}
function freshMusic() {
  if (!AC) return;
  try { music.disconnect(); } catch (e) {}
  music = AC.createGain(); music.gain.value = 1; music.connect(master);
}
function stopMusic() { if (!AC) return; music.gain.setTargetAtTime(0, AC.currentTime, .03); }
function playMelody(mel, bpm, swingy, voice) {
  if (!AC) return 0;
  freshMusic();
  const beat = 60 / bpm; let t = AC.currentTime + .08;
  mel.forEach(([m, d], i) => {
    const len = d * beat;
    if (voice === 'organ') { tone(t, mtof(m), 'sawtooth', .14, Math.max(.3, len * 1.05), music, 2200); tone(t, mtof(m - 12), 'square', .07, Math.max(.3, len * 1.05), music, 1200); }
    else tone(t, mtof(m), 'triangle', .32, Math.max(.25, len * .95), music, 3000);
    tone(t, mtof(m + 12), 'sine', .06, Math.max(.15, len * .6), music);
    if (swingy && i % 2 === 0) tone(t, mtof(m - 24), 'triangle', .3, beat * .9, music, 600);
    t += len;
  });
  return t - AC.currentTime;
}
function playSwing(bars) {
  freshMusic();
  const beat = 60 / 150, bass = [41, 45, 48, 50, 43, 46, 50, 49, 48, 45, 43, 40];
  let t = AC.currentTime + .08;
  for (let n = 0; n < bars * 4; n++) {
    tone(t, mtof(bass[n % bass.length]), 'triangle', .55, beat * .9, music, 700);
    noise(t, 'highpass', 7000, n % 2 ? .12 : .07, .25, music);
    if (n % 2) noise(t + beat * 2 / 3, 'highpass', 7000, .06, .15, music);
    t += beat;
  }
}
function sfx(k) {
  if (!AC) return; const t = AC.currentTime;
  if (k === 'ok') { tone(t, 659, 'sine', .22, .2); tone(t + .09, 988, 'sine', .22, .35); }
  else if (k === 'ko') { const o = tone(t, 200, 'sawtooth', .13, .4, master, 900); o.frequency.exponentialRampToValueAtTime(90, t + .4); }
  else if (k === 'tick') tone(t, 1400, 'square', .03, .02, master, 3000);
  else if (k === 'horn') { [0, .14, .28].forEach((d, i) => tone(t + d, mtof([60, 64, 67][i]), 'sawtooth', .09, .5, master, 1400)); tone(t + .42, mtof(72), 'sawtooth', .11, .9, master, 1400); }
  else if (k === 'scratch') {
    const s = noise(t, 'bandpass', 1800, .6, .5); const f = AC.createBiquadFilter();
    const o = tone(t, 900, 'sawtooth', .2, .5, master, 2500); o.frequency.exponentialRampToValueAtTime(60, t + .5);
  }
  else if (k === 'glitch') { for (let i = 0; i < 8; i++) tone(t + i * .07, 200 + Math.random() * 1500, 'square', .06, .05, master, 4000); }
}

(() => {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone;
  const btn = $('#fs');
  if (!req || standalone) return;
  btn.hidden = false;
  btn.onclick = () => {
    const active = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      const r = active ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : req.call(el);
      if (r && r.catch) r.catch(() => {});
    } catch (e) {}
  };
})();

hud();
titleScreen();
})();
</script>
